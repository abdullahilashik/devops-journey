
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile

    image: custom-jenkins:latest
    container_name: jenkins_container

    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - jenkins_network

networks:
  jenkins_network:
    driver: bridge

volumes:
  jenkins_home:
    driver: local
