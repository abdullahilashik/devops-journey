services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - //./pipe/docker_engine:///./pipe/docker_engine
      # - /var/run/docker.sock:/var/run/docker.sock
      # - //./pipe/dockerDesktopLinuxEngine:///./pipe/docker_engine
volumes:
  jenkins_home: